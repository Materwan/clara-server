[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clara-server"
version = "0.3.0"
description = "Clara: one AI with one memory, served over HTTP to any number of clients"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "ollama>=0.4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "prompt_toolkit>=3.0",
    "pypdf>=4.0",  # the text of PDF documents attached on the web site
    "cryptography>=3.1",  # pypdf needs it for the PDFs encrypted with AES (most of the "protected" ones)
    "tzdata; sys_platform == 'win32'",  # Windows has no timezone database of its own
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
discord = ["discord.py>=2.4"]  # the Discord bot (built in, or on its own: clara-discord)

[project.scripts]
clara-server = "clara.server:main"
clara-chat = "clara.client:main"
clara-admin = "clara.admin:main"
clara-discord = "clara.discord_bot.standalone:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clara = ["web/*", "web/fonts/*", "web/katex/*", "web/katex/fonts/*"]  # the web site, its fonts, and KaTeX (formulas)

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]  # pycodestyle, pyflakes, import order, bugbear
ignore = [
    "E501",  # long lines are left to the author's judgement
    "B905",  # zip() without strict=
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
